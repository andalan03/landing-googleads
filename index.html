  <!-- SCRIPT TRACKING BULLETPROOF UNTUK BROWSER LAMA -->
  <script>
    var GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbw1ASwQnLVm-sAjf-v7k9Kftdr0yrP_UOgv7jKGfATEL2wUpqCf0Qc0__BlsHage1Aw/exec";
    var WA_NUMBER = "6282277790619";
    var WA_TEXT = "Halo Kak, saya berminat dengan produknya.";

    var visitorDataCache = { ip: '-', city: '-' };

    if (window.fetch) {
      window.addEventListener('DOMContentLoaded', function() {
        fetch('https://ipapi.co/json/')
          .then(function(res) { return res.json(); })
          .then(function(data) {
            visitorDataCache.ip = data.ip || '-';
            visitorDataCache.city = (data.city && data.region) ? (data.city + ', ' + data.region) : (data.city || '-');
          })
          .catch(function(err) {});
      });
    }

    function getQueryParam(key) {
      var match = RegExp('[?&]' + key + '=([^&]*)').exec(window.location.search);
      var val = match && decodeURIComponent(match[1].replace(/\+/g, ' '));
      if (val) {
        try { sessionStorage.setItem('track_' + key, val); } catch(e) {}
        return val;
      }
      try {
        var stored = sessionStorage.getItem('track_' + key);
        return stored ? stored : '-';
      } catch(e) {
        return '-';
      }
    }

    function parseUA() {
      var ua = navigator.userAgent;
      var os = "Unknown OS";
      var browser = "Unknown Browser";
      var model = "Desktop/Generic";

      if (/windows nt/i.test(ua)) os = "Windows";
      else if (/android/i.test(ua)) os = "Android";
      else if (/iphone|ipad|ipod/i.test(ua)) os = "iOS";
      else if (/mac os x/i.test(ua)) os = "macOS";

      if (/chrome|crios/i.test(ua) && !/edge|edg|opr|opera/i.test(ua)) browser = "Chrome";
      else if (/safari/i.test(ua) && !/chrome|crios/i.test(ua)) browser = "Safari";
      else if (/firefox|fxios/i.test(ua)) browser = "Firefox";

      if (/iphone/i.test(ua)) model = "Apple iPhone";
      else if (/ipad/i.test(ua)) model = "Apple iPad";
      else if (/android/i.test(ua)) {
        var match = ua.match(/Android\s+[\d\.]+;\s*([^;\)]+)/i);
        model = match ? match[1] : "Android Device";
      }

      return { os: os, browser: browser, model: model };
    }

    function trackClick() {
      var uaData = parseUA();
      var now = new Date();
      var clickId = "CLK-" + now.getTime() + "-" + Math.floor(Math.random() * 1000);
      var formattedDate = now.toLocaleString ? now.toLocaleString() : now.toString();
      var perangkatBrowser = uaData.model + " / " + uaData.browser + " (" + uaData.os + ")";

      var payload = {
        clickId: clickId,
        waktu: formattedDate,
        gclid: getQueryParam('gclid'),
        gbraid: getQueryParam('gbraid'),
        wbraid: getQueryParam('wbraid'),
        campaignId: getQueryParam('campaignid') || getQueryParam('utm_campaign'),
        adGroupId: getQueryParam('adgroupid') || getQueryParam('utm_content'),
        keyword: getQueryParam('keyword') || getQueryParam('utm_term'),
        matchType: getQueryParam('matchtype'),
        device: getQueryParam('device') || (window.innerWidth <= 768 ? 'Mobile' : 'Desktop'),
        modelDevice: uaData.model,
        browser: uaData.browser,
        os: uaData.os,
        screen: (window.screen ? window.screen.width + "x" + window.screen.height : '-'),
        bahasa: navigator.language || navigator.userLanguage || '-',
        timezone: '-',
        landingPage: window.location.href,
        referrer: document.referrer || 'Direct',
        nomorWA: WA_NUMBER,
        userAgent: navigator.userAgent,
        status: 'Klik WhatsApp',
        catatan: 'Konversi Offline',
        ipAddress: visitorDataCache.ip,
        lokasi: visitorDataCache.city,
        perangkatBrowser: perangkatBrowser
      };

      var queryParts = [];
      for (var key in payload) {
        if (payload.hasOwnProperty(key)) {
          queryParts.push(encodeURIComponent(key) + "=" + encodeURIComponent(payload[key]));
        }
      }
      var queryString = queryParts.join("&");

      // Kirim data latar belakang secara instan tanpa memblokir navigasi link
      if (GOOGLE_SHEET_WEBHOOK_URL) {
        var beacon = new Image();
        beacon.src = GOOGLE_SHEET_WEBHOOK_URL + "?" + queryString;
      }
    }
